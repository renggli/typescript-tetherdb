name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build:
    name: "Node CI"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Code Formatter"
        run: npx @biomejs/biome format .
      - name: "Linter"
        run: npx @biomejs/biome check .
      - name: "Type Checker"
        run: npm run typecheck
      - name: "Build"
        run: npm run build
      - name: "Tests & Coverage"
        run: npm run test:coverage
      - name: "Upload coverage"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
